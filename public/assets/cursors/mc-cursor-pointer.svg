<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- Minecraft Diamond Pickaxe Pointer Cursor (Hotspot: 0, 0) -->
  <!-- Dark Outline -->
  <rect x="0" y="0" width="4" height="2" fill="#000000" />
  <rect x="4" y="0" width="4" height="2" fill="#000000" />
  <rect x="0" y="2" width="2" height="4" fill="#000000" />
  <rect x="8" y="2" width="2" height="4" fill="#000000" />
  <rect x="2" y="4" width="2" height="2" fill="#000000" />
  <rect x="6" y="4" width="2" height="2" fill="#000000" />
  <rect x="4" y="6" width="2" height="2" fill="#000000" />
  <rect x="8" y="6" width="2" height="2" fill="#000000" />

  <!-- Pickaxe Head Fill (Diamond Aqua & Bright Glint) -->
  <rect x="2" y="2" width="2" height="2" fill="#ffffff" />
  <rect x="4" y="2" width="2" height="2" fill="#67e8f9" />
  <rect x="6" y="2" width="2" height="2" fill="#06b6d4" />
  <rect x="4" y="4" width="2" height="2" fill="#22d3ee" />

  <!-- Shaft Outline & Fill (Oak Wood Handle) -->
  <rect x="8" y="8" width="2" height="2" fill="#000000" />
  <rect x="6" y="8" width="2" height="2" fill="#78350f" />
  <rect x="8" y="6" width="2" height="2" fill="#451a03" />

  <rect x="10" y="10" width="2" height="2" fill="#000000" />
  <rect x="8" y="10" width="2" height="2" fill="#92400e" />
  <rect x="10" y="8" width="2" height="2" fill="#78350f" />

  <rect x="12" y="12" width="2" height="2" fill="#000000" />
  <rect x="10" y="12" width="2" height="2" fill="#92400e" />
  <rect x="12" y="10" width="2" height="2" fill="#78350f" />

  <rect x="14" y="14" width="2" height="2" fill="#000000" />
  <rect x="12" y="14" width="2" height="2" fill="#92400e" />
  <rect x="14" y="12" width="2" height="2" fill="#78350f" />

  <rect x="16" y="16" width="2" height="2" fill="#000000" />
  <rect x="14" y="16" width="2" height="2" fill="#78350f" />
  <rect x="16" y="14" width="2" height="2" fill="#451a03" />

  <!-- Pommel -->
  <rect x="16" y="18" width="2" height="2" fill="#000000" />
  <rect x="18" y="16" width="2" height="2" fill="#000000" />
  <rect x="18" y="18" width="2" height="2" fill="#0284c7" />
  <rect x="20" y="20" width="2" height="2" fill="#000000" />
</svg>
