<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- Minecraft Diamond Sword Cursor (Hotspot: 0, 0) -->
  <!-- Dark Contour Outline -->
  <rect x="0" y="0" width="2" height="2" fill="#000000" />
  <rect x="2" y="0" width="2" height="2" fill="#000000" />
  <rect x="0" y="2" width="2" height="2" fill="#000000" />
  <rect x="4" y="2" width="2" height="2" fill="#000000" />
  <rect x="2" y="4" width="2" height="2" fill="#000000" />
  <rect x="6" y="4" width="2" height="2" fill="#000000" />
  <rect x="4" y="6" width="2" height="2" fill="#000000" />
  <rect x="8" y="6" width="2" height="2" fill="#000000" />
  <rect x="6" y="8" width="2" height="2" fill="#000000" />
  <rect x="10" y="8" width="2" height="2" fill="#000000" />
  <rect x="8" y="10" width="2" height="2" fill="#000000" />
  
  <!-- Crossguard & Hilt Outline -->
  <rect x="12" y="8" width="4" height="2" fill="#000000" />
  <rect x="8" y="12" width="2" height="4" fill="#000000" />
  <rect x="12" y="12" width="2" height="2" fill="#000000" />
  <rect x="14" y="14" width="2" height="2" fill="#000000" />
  <rect x="16" y="16" width="2" height="2" fill="#000000" />
  <rect x="18" y="18" width="2" height="2" fill="#000000" />

  <!-- Diamond Blade Fill -->
  <rect x="2" y="2" width="2" height="2" fill="#ffffff" />
  <rect x="4" y="4" width="2" height="2" fill="#a5f3fc" />
  <rect x="6" y="6" width="2" height="2" fill="#38bdf8" />
  <rect x="8" y="8" width="2" height="2" fill="#0284c7" />
  
  <!-- Guard Fill (Gold & Wood) -->
  <rect x="10" y="12" width="2" height="2" fill="#f59e0b" />
  <rect x="12" y="10" width="2" height="2" fill="#f59e0b" />
  <rect x="10" y="10" width="2" height="2" fill="#78350f" />
  
  <!-- Hilt Grip & Pommel -->
  <rect x="12" y="14" width="2" height="2" fill="#78350f" />
  <rect x="14" y="12" width="2" height="2" fill="#451a03" />
  <rect x="14" y="16" width="2" height="2" fill="#78350f" />
  <rect x="16" y="14" width="2" height="2" fill="#451a03" />
  <rect x="16" y="18" width="2" height="2" fill="#0284c7" />
  <rect x="18" y="16" width="2" height="2" fill="#38bdf8" />
</svg>
